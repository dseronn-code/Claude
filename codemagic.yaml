workflows:
  apk:
    name: Jogo da Velha APK
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
